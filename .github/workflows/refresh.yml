name: Refresh S&P 500 internals dashboard

on:
  schedule:
    # 00:30 UTC Tue-Sat: after the US close, and one hour after the yield-internals dashboard (23:30 UTC).
    # The offset matters if both use the same Tiingo token: the free tier allows 50 requests/hour, and each
    # build uses ~25-27, so running both in the same hour can hit the cap.
    # That is 10:30 AEST / 11:30 AEDT in Melbourne. GitHub may start scheduled runs late under load.
    - cron: "30 0 * * 2-6"
  workflow_dispatch:
    inputs:
      clear_cache:
        description: "Ignore the saved download cache and refetch everything"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - rebuild.py
      - requirements.txt
      - tests/**
      - .github/workflows/refresh.yml
  # PRs (including Dependabot action bumps) build and render-check, but never deploy.
  pull_request:
    paths:
      - rebuild.py
      - requirements.txt
      - tests/**
      - .github/workflows/refresh.yml

permissions:
  contents: read

concurrency:
  group: spx-internals-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Download cache carries Yahoo/Treasury history between runs, so a failed download
      # falls back to yesterday's copy (flagged stale on the page) instead of breaking the build.
      - name: Restore download cache
        if: ${{ !inputs.clear_cache }}
        uses: actions/cache/restore@v5
        with:
          path: cache
          key: spx-data-${{ github.run_id }}
          restore-keys: spx-data-

      # Build with a job-level retry. Yahoo Finance sometimes rate-limits GitHub's shared runner IPs (HTTP 429);
      # rebuild.py already does a crumb handshake and per-request backoff, and on a warm cache a failed ticker
      # falls back to yesterday's copy. This second attempt covers a cold cache landing in a bad Yahoo window.
      - name: Build dashboard (first attempt)
        id: build1
        continue-on-error: true
        run: python rebuild.py --out site --cache cache --max-age-days 7
        env:
          TIINGO_TOKEN: ${{ secrets.TIINGO_TOKEN }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Wait and retry if the first attempt failed
        if: ${{ steps.build1.outcome == 'failure' }}
        run: |
          echo "First build failed (exit ${{ steps.build1.outputs.exit_code || 'nonzero' }}); waiting 120s before retry."
          sleep 120

      - name: Build dashboard (retry)
        if: ${{ steps.build1.outcome == 'failure' }}
        id: build2
        run: python rebuild.py --out site --cache cache --max-age-days 7
        env:
          TIINGO_TOKEN: ${{ secrets.TIINGO_TOKEN }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Save download cache
        if: ${{ always() && hashFiles('cache/**') != '' }}
        uses: actions/cache/save@v5
        with:
          path: cache
          key: spx-data-${{ github.run_id }}

      - name: Install Chromium for render check
        run: python -m playwright install --with-deps chromium

      - name: Render check (zero console errors)
        run: python tests/check_render.py site/index.html

      - name: Upload dashboard as a downloadable artifact
        uses: actions/upload-artifact@v7
        with:
          name: spx-internals-${{ github.run_number }}
          path: site
          include-hidden-files: true
          retention-days: 30

      - name: Upload Pages artifact
        if: ${{ vars.DEPLOY_TARGET != 'artifact' && github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    # Runs only if the build, the freshness guard and the render check all passed,
    # so a bad day never replaces the last good page.
    needs: build
    if: ${{ vars.DEPLOY_TARGET != 'artifact' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
